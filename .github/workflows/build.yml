name: Build WebGPU app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact three-body commit to build for the website
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Itsusinn/three-body
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: three-body-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('src/**', 'Cargo.toml') }}
          restore-keys: |
            three-body-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Check formatting and WASM code
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Install Trunk and Binaryen
        run: bash scripts/install-trunk.sh
      - name: Build production bundle
        run: |
          trunk build --release --locked
          python3 - <<'PY'
          import gzip, json, os, pathlib, subprocess
          root = pathlib.Path('dist')
          assert (root / 'index.html').is_file()
          assert list(root.glob('*.wasm')), 'Missing WASM bundle'
          assert list(root.glob('*.js')), 'Missing JavaScript loader'
          assert 'live_reload' not in (root / 'index.html').read_text(encoding='utf-8')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (root / 'version.json').write_text(json.dumps({'repository': 'Itsusinn/three-body', 'commit': sha}) + '\n', encoding='utf-8')
          sizes = []
          for wasm in root.glob('*.wasm'):
              data = wasm.read_bytes()
              sizes.append({'file': wasm.name, 'bytes': len(data), 'gzip_bytes': len(gzip.compress(data, compresslevel=9, mtime=0))})
          (root / 'size-report.json').write_text(json.dumps(sizes, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## WASM size\n\n| File | Raw bytes | gzip-9 bytes (estimate) |\n| --- | ---: | ---: |\n')
              for item in sizes:
                  summary.write(f"| {item['file']} | {item['bytes']:,} | {item['gzip_bytes']:,} |\n")
          assert sum(item['bytes'] for item in sizes) <= 5_000_000, 'WASM exceeds the 5 MB size budget'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-body-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy-website:
    name: Trigger website deployment
    needs: build
    if: >-
      github.repository == 'Itsusinn/three-body' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the website workflow
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set WEBSITE_DEPLOY_TOKEN to a fine-grained PAT scoped to Itsusinn/itsusinn.github.io with Actions: write. See AGENTS.md.'
            exit 1
          fi
          gh workflow run deploy.yml --repo Itsusinn/itsusinn.github.io --ref master
