[package]
name = "three-body"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Interactive Pythagorean three-body laboratory powered by WebGPU"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }

[profile.release]
opt-level = 2
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
