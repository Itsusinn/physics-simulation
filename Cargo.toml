[package]
name = "three-body"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Interactive Pythagorean three-body laboratory powered by WebGPU"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_camera", "bevy_shader", "keyboard", "mouse", "touch"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["default_fonts", "render"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
ode_solvers = "=0.6.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser rendering uses WebGPU only.
bevy = { version = "=0.20.0", default-features = false, features = ["webgpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native application and offscreen rendering tests.
bevy = { version = "=0.20.0", default-features = false, features = ["x11", "multi_threaded"] }

[profile.release]
# Keep size-oriented optimization; measure changes against the Bevy baseline.
opt-level = "s"
lto = "fat"
codegen-units = 1
# Let wasm-opt strip names after reading Rust's target_features metadata.

[lints.rust]
unsafe_code = "forbid"
