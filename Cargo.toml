[package]
name = "three-body"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Interactive Pythagorean three-body laboratory powered by WebGPU"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu_no_default_features"] }
ode_solvers = "=0.6.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Enable only WebGPU: egui-wgpu's defaults also pull in WebGL and its shader compiler.
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Keep native backends available for the GPU integration tests.
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu"] }

[profile.release]
# Measured smaller than "z" for this egui/wgpu application.
opt-level = "s"
lto = "fat"
codegen-units = 1
# Let wasm-opt strip names after reading Rust's target_features metadata.

[lints.rust]
unsafe_code = "forbid"
