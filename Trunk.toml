[build]
target = "index.html"
dist = "dist"
public_url = "./"

[tools]
wasm_opt = "version_133"

[[hooks]]
stage = "post_build"
command = "python"
command_arguments = ["scripts/fix-wasm-progress.py"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[watch]
ignore = ["dist", "target", ".tools"]
